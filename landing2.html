<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>ARTENIA – Hexágono Analógico Revelado</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
/* ================= RESET ================= */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  background: #0e0e0e;
  font-family: "Inter", sans-serif;
  overflow: hidden;
}

/* ================= PANTALLA COMPLETA ================= */
.hexscreen {
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #0b0b0b;
  position: relative;
}

/* ================= CONTENEDOR HEXAGONAL ================= */
.hex-wrapper {
  width: min(88vw, 88vh);
  aspect-ratio: 1;

  position: relative;
  overflow: hidden;

  clip-path: polygon(
    25% 4%, 75% 4%,
    96% 50%,
    75% 96%, 25% 96%,
    4% 50%
  );

  border: 2px solid rgba(255,255,255,0.25);
  filter: drop-shadow(0 0 18px rgba(0,0,0,0.9));

  animation: analogBreath 7s ease-in-out infinite;
  opacity: 0;
  animation: fadeInChemistry 4s ease-out forwards, analogBreath 7s ease-in-out infinite 4s;
}

/* ================= IMAGEN/VIDEO ================= */
.hex-media {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;

  filter:
    contrast(1.1)
    brightness(1.03)
    saturate(0.9)
    blur(0.35px);

  transform: scale(1.04);
  animation: filmFlicker 6s infinite steps(3);
}

/* ================= TEXTURAS ================= */

/* Grain tipo película */
.hex-grain {
  pointer-events: none;
  position: absolute;
  inset: 0;
  background-image: url('https://grainy-gradients.vercel.app/noise.png');
  opacity: 0.12;
  mix-blend-mode: overlay;
  animation: grainMove 1.6s steps(3) infinite;
}

/* Light leaks (manchas de luz tipo carrete 35mm) */
.hex-lightleak {
  pointer-events: none;
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 85% 20%, rgba(255,120,80,0.28), transparent 60%),
              radial-gradient(circle at 10% 80%, rgba(255,0,70,0.25), transparent 70%);
  mix-blend-mode: screen;
  opacity: 0.20;
  animation: lightLeakMove 8s ease-in-out infinite;
}

/* Textura papel */
.hex-paper {
  pointer-events: none;
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 30% 20%, rgba(255,255,255,0.08), transparent 60%),
    linear-gradient(to bottom, rgba(255,255,255,0.05), rgba(0,0,0,0.2));
  mix-blend-mode: soft-light;
  opacity: 0.24;
}

/* ================= TITULO OPCIONAL ================= */
.title {
  position: absolute;
  top: 5%;
  width: 100%;
  text-align: center;
  color: #fff;
  font-size: 1.1rem;
  letter-spacing: 0.12em;
  opacity: 0.8;
  pointer-events: none;
  text-transform: uppercase;
}

/* ================= ANIMACIONES ================= */

@keyframes analogBreath {
  0%   { transform: scale(0.985); }
  50%  { transform: scale(1.015); }
  100% { transform: scale(0.985); }
}

@keyframes grainMove {
  0%   { transform: translate(0,0); }
  50%  { transform: translate(-2%,1%); }
  100% { transform: translate(0,0); }
}

@keyframes filmFlicker {
  0% { opacity: 1; }
  10% { opacity: 0.95; }
  20% { opacity: 1; }
  22% { opacity: 0.96; }
  24% { opacity: 1; }
}

@keyframes fadeInChemistry {
  0%   { opacity: 0; filter: blur(18px); }
  20%  { opacity: 0.4; filter: blur(12px); }
  60%  { opacity: 0.7; filter: blur(6px); }
  100% { opacity: 1; filter: blur(0px); }
}

@keyframes lightLeakMove {
  0%   { transform: translate(0,0) scale(1); }
  50%  { transform: translate(-3%,3%) scale(1.08); }
  100% { transform: translate(0,0) scale(1); }
}
</style>
</head>

<body>

<div class="hexscreen">

  <div class="title">ARTESANO · REVELADO ANALÓGICO</div>

  <div class="hex-wrapper">

    <!-- EJEMPLO DE IMAGEN ANALÓGICA -->
    <img src="https://images.unsplash.com/photo-1527281400683-1f1c52fdf7e0?auto=format&fit=crop&w=900&q=60"
         class="hex-media"
         alt="Ejemplo de Artesano" />

    <!-- Si deseas usar vídeo, reemplaza lo anterior por:
    <video class="hex-media" autoplay muted loop playsinline>
      <source src="artesano.mp4" type="video/mp4">
    </video>
    -->

    <div class="hex-grain"></div>
    <div class="hex-lightleak"></div>
    <div class="hex-paper"></div>

  </div>

</div>

</body>
</html>
